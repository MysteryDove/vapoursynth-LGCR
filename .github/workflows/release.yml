name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (for example, v1.8.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate release target
        id: validate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH (for example, v1.8.0)" >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install VapourSynth and test dependencies
        run: python -m pip install "VapourSynth==79" numpy pillow
      - name: Build and run release checks
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${TAG#v}"
          IFS=. read -r version_major version_minor version_patch <<< "$version"
          VSINCLUDE="$(python -c 'import pathlib, vapoursynth; print(pathlib.Path(vapoursynth.__file__).parent / "include")')"
          make check VSINCLUDE="$VSINCLUDE" PYTHON=python \
            LGCR_VERSION_MAJOR="$version_major" LGCR_VERSION_MINOR="$version_minor" \
            -j"$(nproc)"
      - name: Package Linux plugin
        run: |
          archive="lgcr-${{ needs.prepare.outputs.tag }}-linux-x86_64.tar.gz"
          tar czf "$archive" liblgcr.so README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: lgcr-linux-x86_64
          path: lgcr-${{ needs.prepare.outputs.tag }}-linux-x86_64.tar.gz

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch VapourSynth headers
        shell: cmd
        run: git clone --depth 1 --branch R79 https://github.com/vapoursynth/vapoursynth.git %RUNNER_TEMP%\vs
      - name: Build and package Windows plugin
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.tag }}".Substring(1).Split(".")
          cl /nologo /O2 /std:c++17 /arch:AVX2 /EHsc /D_USE_MATH_DEFINES /DLGCR_ENABLE_CUDA=0 `
            /DLGCR_VERSION_MAJOR=$($version[0]) /DLGCR_VERSION_MINOR=$($version[1]) `
            /I"$env:RUNNER_TEMP\vs\include" /LD `
            src\pipeline.cpp src\cuda_backend.cpp src\maps.cpp src\kernels.cpp src\recon.cpp src\algos.cpp src\plugin.cpp `
            /Fe:lgcr.dll
          $archive = "lgcr-${{ needs.prepare.outputs.tag }}-windows-x86_64.zip"
          Compress-Archive -Path lgcr.dll,README.md,LICENSE -DestinationPath $archive
      - uses: actions/upload-artifact@v4
        with:
          name: lgcr-windows-x86_64
          path: lgcr-${{ needs.prepare.outputs.tag }}-windows-x86_64.zip

  publish:
    needs: [prepare, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lgcr-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=("$TAG" dist/* --target "$SHA" --title "LGCR $TAG" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
