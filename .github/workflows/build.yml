name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  VS_TAG: R79

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VapourSynth runtime and test dependencies
        run: python -m pip install "VapourSynth==79" numpy pillow

      - name: Run correctness gates
        run: |
          VSINCLUDE="$(python -c 'import pathlib, vapoursynth; print(pathlib.Path(vapoursynth.__file__).parent / "include")')"
          make check VSINCLUDE="$VSINCLUDE" PYTHON=python -j"$(nproc)"
          make asan-check VSINCLUDE="$VSINCLUDE" PYTHON=python -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: lgcr-linux-x86_64
          path: liblgcr.so

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch VapourSynth headers
        shell: cmd
        run: git clone --depth 1 --branch %VS_TAG% https://github.com/vapoursynth/vapoursynth.git %RUNNER_TEMP%\vs

      - name: Build lgcr.dll (AVX2)
        shell: cmd
        run: >
          cl /nologo /O2 /std:c++17 /arch:AVX2 /EHsc /D_USE_MATH_DEFINES
          /DLGCR_ENABLE_CUDA=0 /DLGCR_VERSION_MAJOR=1 /DLGCR_VERSION_MINOR=0
          /I%RUNNER_TEMP%\vs\include /LD
          src\pipeline.cpp src\cuda_backend.cpp src\maps.cpp src\kernels.cpp
          src\recon.cpp src\algos.cpp src\bm.cpp src\downsample.cpp src\plugin.cpp
          /Fe:lgcr.dll

      - uses: actions/upload-artifact@v4
        with:
          name: lgcr-windows-x86_64
          path: lgcr.dll
